name: Lint example hooks

on:
  pull_request:
    paths: ['examples/**', 'scripts/**', '.github/workflows/lint.yml']
  push:
    branches: [main]
    paths: ['examples/**', 'scripts/**', '.github/workflows/lint.yml']
  workflow_dispatch:

# This workflow's own file is in the paths filters above, so edits to it are
# re-linted without a manual dispatch.

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show shellcheck version
        run: shellcheck --version
      - name: ShellCheck example hooks (POSIX sh)
        run: |
          shopt -s globstar
          files=(examples/**/*.sh)
          if [ ! -f "${files[0]}" ]; then
            echo "::error::no shell scripts found under examples/"
            exit 1
          fi
          echo "checking: ${files[*]}"
          shellcheck -s sh "${files[@]}"
