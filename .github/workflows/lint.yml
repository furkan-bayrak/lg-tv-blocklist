name: Lint example hooks

on:
  pull_request:
    paths: ['examples/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['examples/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show shellcheck version
        run: shellcheck --version
      - name: ShellCheck example hooks (POSIX sh)
        run: |
          find examples -type f -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck -s sh
