name: Build blocklists

on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'lists/**', '.github/workflows/build.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: lists
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.changed.outputs.src_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect src/scripts changes
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "$GITHUB_SHA" -- src/ scripts/; then
            echo "src_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject direct lists/ edits in PRs
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- lists/)"
          if [ -n "$changed" ]; then
            echo "::error::lists/ is generated by scripts/build.py from src/ and scripts/ -- edit src/ instead; direct lists/ changes are rejected in PRs."
            exit 1
          fi
      - name: Validate source + compile dry-run
        run: python3 scripts/build.py check
      - name: Run test suite
        run: python3 scripts/test_build.py
      - name: Run localize tests
        run: python3 scripts/test_localize.py

  publish:
    if: github.event_name != 'pull_request' && needs.check.outputs.src_changed == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Compile lists
        run: python3 scripts/build.py build
      - name: Verify checksums
        run: cd lists && sha256sum -c SHA256SUMS
      - name: Commit generated lists
        run: |
          if ! git diff --quiet -- lists; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lists/
            git commit -m "chore: regenerate blocklists [skip ci]"
            git push
          fi
