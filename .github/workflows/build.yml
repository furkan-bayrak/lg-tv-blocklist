name: Build blocklists

on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'lists/**']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**']
  workflow_dispatch:

concurrency:
  group: lists
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject direct lists/ edits in PRs
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD -- lists/ | grep -q .; then
            echo "::error::lists/ is generated by scripts/build.py from src/ and scripts/ -- edit src/ instead; direct lists/ changes are rejected in PRs."
            exit 1
          fi
      - name: Validate source + compile dry-run
        run: python3 scripts/build.py check
      - name: Run test suite
        run: python3 scripts/test_build.py
      - name: Run localize tests
        run: python3 scripts/test_localize.py

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile lists
        run: python3 scripts/build.py build
      - name: Commit generated lists
        run: |
          if ! git diff --quiet -- lists; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lists/
            git commit -m "chore: regenerate blocklists [skip ci]"
            git push
          fi
