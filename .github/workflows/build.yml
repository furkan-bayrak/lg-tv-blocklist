name: Build blocklists

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: lists
  cancel-in-progress: false

# Workflow-file edits are covered by the push paths filter above. publish is gated
# on actual src/ or scripts/ changes so workflow-only pushes don't churn lists
# (the Updated timestamp would otherwise create a bot commit every run).

permissions:
  contents: read

jobs:
  check:
    name: Validate blocklists
    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.changed.outputs.src_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect src/scripts changes
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE_SHA"
          # Fail-open: empty/all-zeros base SHA (ref creation) assumes changed,
          # as does a force-push whose unreachable base fails the diff below.
          # Worst case is one redundant publish run (timestamp-only bot commit).
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "$GITHUB_SHA" -- src/ scripts/; then
            echo "src_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject direct lists/ edits in PRs
        if: github.event_name == 'pull_request'
        env:
          # Three-dot diff between base SHA and PR head SHA (not the merge ref
          # checked out by actions/checkout): the merge ref also contains
          # main-side bot regeneration commits, so a stale base.sha made their
          # lists/ churn look like PR edits (false positive on PR #9).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- lists/)"
          if [ -n "$changed" ]; then
            echo "::error::lists/ is generated by scripts/build.py from src/ and scripts/ -- edit src/ instead; direct lists/ changes are rejected in PRs."
            exit 1
          fi
      - name: Validate source + compile dry-run
        run: python3 scripts/build.py check
      - name: Run test suite
        run: python3 scripts/test_build.py
      - name: Run localize tests
        run: python3 scripts/test_localize.py
      - name: Run verify tests
        run: python3 scripts/test_verify.py
      - name: Run nextdns sync tests
        run: python3 scripts/test_nextdns_sync.py
      - name: Run check_blocking tests
        run: python3 scripts/test_check_blocking.py

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.src_changed == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Provision the LG-only publisher App before enabling branch protection.
      # Missing credentials fail publication; GITHUB_TOKEN is never a fallback.
      - name: Create repository-scoped publisher token
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BLOCKLIST_PUBLISH_APP_ID }}
          private-key: ${{ secrets.BLOCKLIST_PUBLISH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          # Build the validated event revision, never a moving branch tip.
          ref: ${{ github.sha }}
          token: ${{ steps.publisher.outputs.token }}
      - name: Compile lists
        run: python3 scripts/build.py build
      - name: Verify checksums
        run: cd lists && sha256sum -c SHA256SUMS
      - name: Commit generated lists
        env:
          APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Check index and worktree separately: either can contain pending
          # tracked changes that the other view hides. Never publish those.
          if ! git diff --quiet -- . ':(exclude)lists/' ||
             ! git diff --cached --quiet -- . ':(exclude)lists/'; then
            echo "::error::Refusing publication: pending tracked changes outside lists/."
            exit 1
          fi
          git add -- lists/
          if ! git diff --cached --quiet; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate blocklists [skip ci]"
            # A concurrent main update must fail, never be overwritten.
            git push origin HEAD:refs/heads/main
          fi
