name: Build blocklists

on:
  pull_request:
    paths: ['src/**', 'scripts/**', '.github/workflows/**', '.gitattributes', 'lists/**']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/**', '.gitattributes']
  workflow_dispatch:

concurrency:
  group: blocklists-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject direct lists/ edits in PRs
        if: github.event_name == 'pull_request'
        env:
          # Three-dot diff between base SHA and PR head SHA (not the merge ref
          # checked out by actions/checkout): the merge ref also contains
          # main-side bot regeneration commits, so a stale base.sha made their
          # lists/ churn look like PR edits (false positive on PR #9).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- lists/)"
          if [ -n "$changed" ]; then
            echo "::error::lists/ is generated by scripts/build.py from src/ and scripts/ -- edit src/ instead; direct lists/ changes are rejected in PRs."
            exit 1
          fi
      - name: Validate source + compile dry-run
        run: python3 scripts/build.py check
      - name: Run test suite
        run: python3 scripts/test_build.py
      - name: Run localize tests
        run: python3 scripts/test_localize.py
      - name: Run verify tests
        run: python3 scripts/test_verify.py
      - name: Run nextdns sync tests
        run: python3 scripts/test_nextdns_sync.py
      - name: Run check_blocking tests
        run: python3 scripts/test_check_blocking.py
      - name: Test list publication with local Git repositories
        run: python3 scripts/test_publish.py
      - name: Install offline resolver test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dnsmasq-base dnsutils
      - name: Prove dnsmasq A and AAAA filtering offline
        run: python3 scripts/test_dnsmasq.py

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish validated lists
        env:
          VALIDATED_HEAD: ${{ github.sha }}
          PUBLICATION_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/publish_lists.py --validated-head "$VALIDATED_HEAD" --branch "$PUBLICATION_BRANCH"
